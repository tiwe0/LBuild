name: CI

on:
  push:
    branches: ["github-ci-build-test", master, arm64]
  pull_request:
    branches: [master, arm64]
  workflow_dispatch:
    inputs:
      smoke_mode:
        description: Guest oracle mode for a manual diagnostic run.
        required: false
        type: choice
        options: [positive, injected-failure]
        default: positive
      upload_failure_image:
        description: Upload the large raw image when a manual run fails.
        required: false
        type: boolean
        default: false
  workflow_call:
    inputs:
      run_id:
        description: Distinguishes reusable stress invocations and artifacts.
        required: false
        type: string
        default: ci
      smoke_mode:
        description: Guest oracle mode.
        required: false
        type: string
        default: positive
      upload_failure_image:
        description: Upload the large raw image on failure.
        required: false
        type: boolean
        default: false
      smoke_cpus:
        description: Virtual CPU count.
        required: false
        type: number
        default: 4
      smoke_memory:
        description: Guest RAM size accepted by QEMU, for example 2G.
        required: false
        type: string
        default: 2G

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ inputs.run_id || 'ci' }}
  cancel-in-progress: true

jobs:
  static-host:
    name: Static host tests
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      # Most of the host suite is shell and grep, but a significant minority
      # cross-compile probe forms, so the runner needs SBCL.
      #
      # The suite also calls GNU tools that macOS either lacks (timeout) or
      # ships in a different dialect (sha256sum, sed -i).  Homebrew's coreutils
      # provides them under their GNU names in libexec/gnubin, which is exactly
      # how the development machine is set up, so no script needs a platform
      # branch.
      - name: Install SBCL and GNU tools
        run: |
          set -euo pipefail
          brew install --quiet sbcl coreutils gnu-sed
          echo "$(brew --prefix coreutils)/libexec/gnubin" >> "$GITHUB_PATH"
          echo "$(brew --prefix gnu-sed)/libexec/gnubin" >> "$GITHUB_PATH"
          sbcl --version

      - name: Run host test suite
        run: Lambda64/tests/host/run.sh

  arm64-integration:
    name: ARM64 build and QEMU integration (${{ inputs.smoke_mode || 'positive' }})
    needs: static-host
    # Manual and scheduled runs only.  This job builds an image and boots it
    # under QEMU, which costs upwards of two hours; running it on every push
    # makes ordinary CI useless as a signal.  Push and pull_request get the
    # static host suite, which is fast.
    #
    # The condition is written as "not push, not pull_request" rather than
    # testing for workflow_dispatch or workflow_call, because a reusable
    # workflow sees the *caller's* event name -- the weekly stress matrix
    # invokes this workflow and arrives here as "schedule".
    if: github.event_name != 'push' && github.event_name != 'pull_request'
    runs-on: macos-latest
    timeout-minutes: 150

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Verify clean input
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          test -z "$(git status --porcelain --untracked-files=no)"

      - name: Install build and QEMU dependencies
        run: |
          set -euo pipefail
          brew install --quiet sbcl qemu coreutils gnu-sed
          echo "$(brew --prefix coreutils)/libexec/gnubin" >> "$GITHUB_PATH"
          echo "$(brew --prefix gnu-sed)/libexec/gnubin" >> "$GITHUB_PATH"
          sbcl --version
          qemu-system-aarch64 --version | head -n 1

      - name: Install Quicklisp and dependencies
        shell: bash
        run: |
          set -euo pipefail

          retry() {
            local max_attempts="$1"
            shift
            local delay=5
            local attempt
            for ((attempt = 1; attempt <= max_attempts; attempt++)); do
              if "$@"; then
                return 0
              fi
              if ((attempt == max_attempts)); then
                echo "Command failed after ${max_attempts} attempts: $*" >&2
                return 1
              fi
              echo "Attempt ${attempt}/${max_attempts} failed; retrying in ${delay}s: $*" >&2
              sleep "$delay"
              delay=$((delay * 2))
            done
          }

          install_quicklisp() {
            rm -rf "$HOME/quicklisp"
            curl --fail --show-error --location \
              --retry 5 --retry-all-errors --retry-delay 2 \
              https://beta.quicklisp.org/quicklisp.lisp \
              -o /tmp/quicklisp.lisp || return 1
            sbcl --non-interactive \
              --load /tmp/quicklisp.lisp \
              --eval '(quicklisp-quickstart:install :path (merge-pathnames "quicklisp/" (user-homedir-pathname)))' \
              --eval '(ql-util:without-prompting (ql:add-to-init-file))' || return 1
          }

          if [ ! -s ~/quicklisp/setup.lisp ] || [ ! -s ~/quicklisp/dists/quicklisp/systems.txt ]; then
            retry 3 install_quicklisp
          fi

          quickload_dependencies() {
            sbcl --non-interactive \
              --eval "(ql:quickload '(alexandria iterate nibbles cl-ppcre cl-fad closer-mop trivial-gray-streams) :silent t)" \
              --eval '(quit)'
          }

          retry 3 quickload_dependencies

      - name: Verify ARM64 GC code generation
        shell: bash
        run: Lambda64/tools/ci/test-arm64-scavenge-codegen.sh

      - name: Build test image (50 minute budget)
        shell: bash
        run: |
          set -euo pipefail
          timeout --foreground 3000 \
            make \
              IMAGE=lambda64.image \
              test-image \
            2>&1 | tee "${{ github.workspace }}/build-test-image.log"

      - name: Record artifact provenance
        shell: bash
        run: |
          set -euo pipefail
          sha256sum \
            lambda64.image \
            lambda64.map \
            lambda64.symbol-table \
            lambda64.test-manifest \
            > artifact-sha256s.txt
          cat lambda64.test-manifest
          cat artifact-sha256s.txt

      - name: Start file server
        shell: bash
        run: |
          set -euo pipefail
          make run-file-server \
            > "${{ github.workspace }}/file-server.log" 2>&1 &
          echo $! > "${{ github.workspace }}/file-server.pid"
          timeout 30 bash -c 'until lsof -i :2599 -sTCP:LISTEN >/dev/null 2>&1; do sleep 1; done'
          echo "File server ready (PID $(cat "${{ github.workspace }}/file-server.pid"))"

      - name: Run immutable ARM64 guest tests (80 minute budget)
        shell: bash
        run: |
          set -euo pipefail
          Lambda64/tools/ci/run-arm64-smoke.sh \
            --mode "${{ inputs.smoke_mode || 'positive' }}" \
            --image "${{ github.workspace }}/lambda64.image" \
            --manifest "${{ github.workspace }}/lambda64.test-manifest" \
            --fixture-root "${{ github.workspace }}/home" \
            --serial-log "${{ github.workspace }}/serial.log" \
            --evidence "${{ github.workspace }}/smoke-evidence.txt" \
            --timeout 4800 \
            --cpus "${{ inputs.smoke_cpus || 4 }}" \
            --memory "${{ inputs.smoke_memory || '2G' }}" \
            --expected-repository-sha "${{ github.sha }}"

      - name: Stop file server
        if: always()
        run: |
          if [ -f "${{ github.workspace }}/file-server.pid" ]; then
            kill "$(cat "${{ github.workspace }}/file-server.pid")" 2>/dev/null || true
          fi

      - name: Upload integration evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arm64-evidence-${{ github.run_id }}-${{ inputs.run_id || 'ci' }}
          path: |
            ${{ github.workspace }}/artifact-sha256s.txt
            ${{ github.workspace }}/lambda64.test-manifest
            ${{ github.workspace }}/lambda64.map
            ${{ github.workspace }}/lambda64.symbol-table
            ${{ github.workspace }}/build-test-image.log
            ${{ github.workspace }}/file-server.log
            ${{ github.workspace }}/serial.log
            ${{ github.workspace }}/smoke-evidence.txt
          retention-days: 14
          if-no-files-found: warn

      - name: Upload raw image for manual failure debugging
        if: failure() && inputs.upload_failure_image
        uses: actions/upload-artifact@v4
        with:
          name: arm64-image-${{ github.run_id }}-${{ inputs.run_id || 'ci' }}
          path: |
            ${{ github.workspace }}/lambda64.image
          retention-days: 3
          if-no-files-found: warn
